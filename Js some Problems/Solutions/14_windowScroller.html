<!-- The Window Scroller:
    You are developing a single-page application with a smooth scrolling effect. Implement a function named smoothScrollToTop that smoothly scrolls the window to the top when called. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Window Scroller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 35px;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .content {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            line-height: 1.8;
        }

        .box {
            height: 500px;
            margin: 30px 0;
            padding: 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;
            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);

            font-size: 25px;
            font-weight: bold;
        }

        .top-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Window Scroller</h1>

        <p>
            Scroll down and click the button to smoothly return to the top.
        </p>

    </div>


    <div class="content">

        <div class="box">
            Section 1
        </div>

        <div class="box">
            Section 2
        </div>

        <div class="box">
            Section 3
        </div>

        <div class="box">
            Section 4
        </div>

    </div>


    <button class="top-button" onclick="smoothScrollToTop()">
        ↑ Scroll to Top
    </button>


    <script>

        function smoothScrollToTop() {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    </script>

</body>

</html>
