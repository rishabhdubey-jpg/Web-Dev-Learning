<!-- The Local Storage Manager:
    You are working on a note-taking app, and you want to implement a function named saveNoteToLocalStorage that takes a note object and saves it to the browser's local storage. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Note Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .container {
            width: 450px;
            max-width: 100%;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .add-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
        }

        .note {
            margin-top: 20px;

            padding: 18px;

            min-height: 80px;

            border-radius: 10px;

            background: #f7f7f7;

            border-left: 5px solid #667eea;

            color: #333;

            line-height: 1.6;

            word-wrap: break-word;
        }

        .empty {
            color: #999;

            text-align: center;

            font-style: italic;
        }

        .note-label {
            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: bold;

            text-transform: uppercase;

            color: #667eea;

            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 Note Manager</h1>

        <p class="subtitle">
            Save your note directly in your browser
        </p>

        <button class="add-btn">
            + Add Note
        </button>

        <div class="note">
            <span class="note-label">Your Note</span>

            <div id="note-content" class="empty">
                No note saved yet.
            </div>
        </div>

    </div>


    <script>
        // Save a note object to localStorage
        function saveNoteToLocalStorage(note) {
            localStorage.setItem("note", JSON.stringify(note));
        }


        // Load saved note when the page starts
        const savedNote = localStorage.getItem("note");

        if (savedNote) {
            const note = JSON.parse(savedNote);

            document.querySelector("#note-content").textContent = note.text;
            document.querySelector("#note-content").classList.remove("empty");
        }


        // Add note when button is clicked
        document.querySelector(".add-btn").addEventListener("click", function () {

            console.log("Button clicked!");

            const noteText = prompt("Enter your note:");

            console.log("User entered:", noteText);

            if (noteText && noteText.trim() !== "") {

                const note = {
                    text: noteText.trim(),
                    createdAt: new Date().toLocaleString()
                };

                saveNoteToLocalStorage(note);

                document.querySelector("#note-content").textContent = note.text;
                document.querySelector("#note-content").classList.remove("empty");
            }
        });
    </script>

</body>

</html>
