<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Water Gun</title>
</head>
<body>
    <!-- Use Javascript to create a game of Snake Water & Gun. The game should ask you to enter s, w or g. The computer should be able to randomly generate S, W or G and declare Win or loss using an alert.
    Use confirm and prompt where required. -->
    
    <script>
        const choices = ['s', 'w', 'g'];
        let userChoice = prompt("Enter your choice (s for Snake, w for Water, g for Gun):").toLowerCase();
        
        if (!choices.includes(userChoice)) {
            alert("Invalid choice! Please enter s, w, or g.");
        } else {
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            alert(`Computer chose: ${computerChoice}`);
            
            if (userChoice === computerChoice) {
                alert("It's a tie!");
            } else if (
                (userChoice === 's' && computerChoice === 'w') ||
                (userChoice === 'w' && computerChoice === 'g') ||
                (userChoice === 'g' && computerChoice === 's')
            ) {
                alert("You win!");
            } else {
                alert("You lose!");
            }
        }
        
    </script>
</body>
</html>
