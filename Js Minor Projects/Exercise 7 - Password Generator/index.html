<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #4f46e5 0%, transparent 35%),
                radial-gradient(circle at bottom right, #9333ea 0%, transparent 35%),
                #0f172a;

            color: #fff;
        }

        /* Main Card */
        #password-container {
            width: 450px;
            max-width: 90%;

            padding: 40px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            text-align: center;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #password-container:hover {
            transform: translateY(-5px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(139, 92, 246, 0.25);
        }

        /* Heading */
        h1 {
            margin-bottom: 10px;

            font-size: 32px;
            font-weight: 700;

            background: linear-gradient(90deg,
                    #a78bfa,
                    #c084fc,
                    #f0abfc);

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Subtitle */
        p {
            margin-top: 20px;

            font-size: 16px;
            color: #cbd5e1;
        }

        /* Generated Password */
        #generated-password {
            display: block;

            margin-top: 18px;
            padding: 15px;

            background: rgba(0, 0, 0, 0.35);

            border: 1px solid rgba(167, 139, 250, 0.4);

            border-radius: 10px;

            font-family: "Courier New", monospace;
            font-size: 20px;
            font-weight: bold;

            color: #a7f3d0;

            letter-spacing: 2px;

            word-break: break-all;

            box-shadow:
                inset 0 0 15px rgba(0, 0, 0, 0.3),
                0 0 15px rgba(34, 197, 94, 0.08);

            transition: all 0.3s ease;
        }

        #generated-password:hover {
            border-color: #a78bfa;

            box-shadow:
                0 0 20px rgba(167, 139, 250, 0.25),
                inset 0 0 15px rgba(0, 0, 0, 0.3);

            transform: scale(1.02);
        }

        /* Small decorative line */
        #password-container::after {
            content: "";

            display: block;

            width: 80px;
            height: 3px;

            margin: 25px auto 0;

            border-radius: 10px;

            background: linear-gradient(90deg,
                    #8b5cf6,
                    #ec4899);
        }

        /* Mobile */
        @media (max-width: 500px) {

            #password-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            #generated-password {
                font-size: 16px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>
    <!-- Create a JavaScript program capable of generating a password which contains at least one lowercase, one uppercase and one special character. Create a Password class to achieve the Same     -->

    <div id="password-container">
        <h1>Password Generator</h1>
        <p>Generated Password: <span id="generated-password"></span></p>
    </div>

    <script>
        class Password {
            constructor(length) {
                this.length = length;
                this.lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
                this.uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                this.specialChars = '!@#$%^&*()_+[]{}|;:,.<>?';
            }

            generate() {
                let password = '';
                password += this.getRandomChar(this.lowercaseChars);
                password += this.getRandomChar(this.uppercaseChars);
                password += this.getRandomChar(this.specialChars);

                const allChars = this.lowercaseChars + this.uppercaseChars + this.specialChars;
                for (let i = 3; i < this.length; i++) {
                    password += this.getRandomChar(allChars);
                }

                return this.shuffle(password);
            }

            getRandomChar(characters) {
                const randomIndex = Math.floor(Math.random() * characters.length);
                return characters[randomIndex];
            }

            shuffle(str) {
                return str.split('').sort(() => Math.random() - 0.5).join('');
            }
        }

        const passwordLength = 12; // You can change the length as needed
        const passwordGenerator = new Password(passwordLength);
        const generatedPassword = passwordGenerator.generate();
        document.getElementById('generated-password').textContent = generatedPassword;


    </script>
</body>

</html>
