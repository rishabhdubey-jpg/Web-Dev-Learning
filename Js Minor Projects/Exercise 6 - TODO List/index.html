<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO list</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .todo-container{
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .todo-input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .todo-list{
            list-style: none;
        }
        .todo-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .todo-item button{
            background: #ff4d4d;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Create a simple TODO list app that allows you to store your TODOs in local storage. Add an option to create delete and process the TODOs.
    Try to make it look nice with some CSS styling -->

    <div class="todo-container">
        <h1>TODO List</h1>
        <input type="text" class="todo-input" placeholder="Add a new task...">
        <ul class="todo-list"></ul>
    </div>

    <script>
        // TODO list functionality will go here
        function loadTodos() {
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            const todoList = document.querySelector('.todo-list');
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    ${todo}
                    <button onclick="deleteTodo(${index})">Delete</button>
                `;
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const input = document.querySelector('.todo-input');
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            if (input.value.trim() !== '') {
                todos.push(input.value.trim());
                localStorage.setItem('todos', JSON.stringify(todos));
                input.value = '';
                loadTodos();
            }
        }

        function deleteTodo(index) {
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            loadTodos();
        }

        document.querySelector('.todo-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        loadTodos();
        

    </script>

</body>
</html>
