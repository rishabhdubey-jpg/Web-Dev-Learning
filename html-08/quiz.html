<!-- Without using br tag, write a vertically aligned form asking for name, city and pincode of a user. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
</head>
<body>
    <h2>Quick Quiz~</h2>

    <form action="post">
        <div>
            <label for="name">Enter yor Name</label>
            <input type="text" name="name" placeholder="Enter your name" autofocus>
        </div>
        
        <div>
            <label for="city">Enter yor City</label>
            <input type="text" name="city" placeholder="Enter your city" autofocus>
        </div>
        
        <div>
            <label for="pin">Enter yor PinCode</label>
            <input type="number" name="pin" placeholder="Enter your pincode" autofocus>
        </div>

</body>
</html>
