<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        div{
            /* background-color: red; */
        }

        /* Class Selector  */
        .red{
            background-color: red;
        }

        /* Id Selector  */
        #green{
            background-color: green;
        }

        /* Child Selector  */
        div > p {
            color: blue;
            background-color: brown;
        }

        /* Descendent Selector  */
        div p {
            color: blue;
            background-color: brown;
        }

        /* Universal Selector  */
        * {
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selector  */
        a:visited{
            color: yellow;
        }

        a:link{
            color: green;
        }

        a:active{
            background-color: darkblue;
        }

        a:hover{
            background-color: lightcoral;
        }

        p:first-child{
            background-color: lightskyblue;
        }
    </style>
</head>

<body>
    <main class="one">
        <p>I am first</p>
        <p>I am second</p>
    </main>
    <div class="red">
        I am a div
        <article>
            <p>I am a para</p>
        </article>
    </div>
    <div id="green">
        I am another div

    </div>
    <a href="https://google.com">Go to Google</a>
    <a href="https://facebook.com">Go to Facebook</a>
</body>

</html>
